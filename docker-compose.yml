version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: oratorhub-db
    environment:
      POSTGRES_DB: oratorhub
      POSTGRES_USER: oratorhub
      POSTGRES_PASSWORD: oratorhub_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oratorhub"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for SSE and Celery
  redis:
    image: redis:7-alpine
    container_name: oratorhub-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flask Application
  web:
    build: .
    container_name: oratorhub-web
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://oratorhub:oratorhub_password@db:5432/oratorhub
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "flask db upgrade &&
             gunicorn --bind 0.0.0.0:5000 --workers 4 --timeout 120 'app:create_app()'"

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: oratorhub-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./uploads:/app/uploads:ro
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
